<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ☠️ 不用 black-translucent：那会让内容**钻到状态栏底下**，而 iPad **没有刘海** ——
         `env(safe-area-inset-top)` 在这些设备上恒为 0，靠 env() 让位是空转，挡住就是挡住。
         实测（加到主屏后）顶栏那 4 个图标（🔄🔊📜🚪）占 y=6..26，整个落在状态栏带里。
         `black` = 不透明黑状态栏，iOS 把 webview 下移到它下面，与本 app 的 gray-900 底色一致。
         这是确定性的让位，不依赖任何 env() 值。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="生物英雄传" />
    <meta name="description" content="龙珠Z风格生物科学卡牌对战游戏 — 在对战中学习生物知识" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <!-- ☠️ apple-touch-icon 必须是 PNG —— iOS **不支持 SVG**，给它 SVG 等于没给：
         「加到主屏」会退化成页面截图缩略图。180×180 是 iOS 的标准尺寸，且必须**方形不透明**
         （iOS 自己加圆角遮罩；预先做圆角+透明会让四角露出黑边）。 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>生物英雄传 Bio Heroes</title>
  </head>
  <body class="bg-gray-900 text-white" style="min-height:100dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 仅在生产 host 注册 Service Worker。dev/localhost/127/.local 不注册，
      // 同时主动 unregister 老的 SW 并清掉 cache（保护历史装过 PWA 的用户/设备，
      // 否则旧 SW 会 cache-first 截住 dev 资源 → 黑屏）。
      ;(function(){
        var h = location.hostname
        var isDev = h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local') || location.port === '5173' || location.port === '4174'
        if (!('serviceWorker' in navigator)) return
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister() }) })
          if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k) }) })
          return
        }
        window.addEventListener('load', function(){
          navigator.serviceWorker.register('/sw.js').catch(function(){})
        })
      })()
    </script>
  </body>
</html>
